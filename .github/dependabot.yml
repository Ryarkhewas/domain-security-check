# Keeps the pinned GitHub Actions and the Python dependencies up to date (one pull request per update)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"  # covers .github/workflows and the action.yml at the root
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
