name: Release

# Publishes a GitHub release with the wheel and the source archive attached.
# The release notes are the matching section of CHANGELOG.md.
#
# Then, from the same files:
# - the Docker images go to the GitHub Container Registry
#   (ghcr.io/ryarkhewas/domain-security-check: <version>, latest, <version>-browser, browser);
# - the package goes to PyPI, once publishing is set up (see "Publishing on PyPI" in README.md):
#   it runs only when the repository variable PUBLISH_TO_PYPI is "true".
#
# Two ways to start it:
# - push a tag such as v1.0.0 (it must match the package version);
# - or click "Run workflow" on the Actions tab: the tag is created from the
#   package version (domaincheck/_version.py) on the selected branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Work out the version and the tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the file directly: importing the package would need its dependencies
          version=$(python -c "ns = {}; exec(open('domaincheck/_version.py').read(), ns); print(ns['__version__'])")
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists: bump the version in domaincheck/_version.py first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found && !/^\[[0-9.]+\]: / { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG.md section for this version"; exit 1; }
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ryarkhewas/domain-security-check
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the standard image
        run: |
          docker build --target standard -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:$VERSION" --version
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
      - name: Build and push the image with a browser (for --browser)
        run: |
          docker build --target browser -t "$IMAGE:$VERSION-browser" -t "$IMAGE:browser" .
          docker push "$IMAGE:$VERSION-browser"
          docker push "$IMAGE:browser"

  pypi:
    needs: release
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/domain-security-check/
    permissions:
      id-token: write  # trusted publishing: no PyPI token stored in the repository
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
