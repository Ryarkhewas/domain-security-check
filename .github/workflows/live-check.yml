name: Live check

# Runs the tool against real domains. Kept separate from the regular tests
# because results depend on external sites, which can change at any time.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # every Monday at 06:17 UTC

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Audit real domains
        run: |
          {
            echo "## Live audit results"
            echo
            python scripts/live_summary.py reports \
              github.com google.com cloudflare.com wikipedia.org \
              docs.github.com gmail.com badssl.com expired.badssl.com self-signed.badssl.com wrong.host.badssl.com
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with Mozilla HTTP Observatory
        # Informational: a grade gap shows up as a warning, never as a failure
        continue-on-error: true
        run: |
          python scripts/observatory_compare.py reports \
            github.com google.com cloudflare.com wikipedia.org docs.github.com badssl.com
          {
            echo
            echo "## Website grade vs Mozilla HTTP Observatory"
            echo
            cat reports/observatory/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Command line on several real domains, with PDF
        run: |
          domain-security-check github.com gmail.com cloudflare.com --pdf --output-dir reports/cli
          ls reports/cli/index.html reports/cli/github.com.pdf reports/cli/gmail.com.pdf reports/cli/cloudflare.com.pdf
      - name: Live tests
        run: python -m pytest -m live -v -rA
      - name: Keep the HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-reports
          path: reports/
