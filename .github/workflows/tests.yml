name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run the demo
        run: domain-security-check --demo -o demo.html

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy

  package:
    # Builds the wheel and installs it in a clean environment, as a user would
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/domain-security-check --version
          /tmp/clean/bin/domain-security-check --demo -o demo.html
          /tmp/clean/bin/domain-security-check --demo --lang fr -o demo_fr.html
          grep -q "Actions prioritaires" demo_fr.html
          grep -q "Guide ANSSI" demo_fr.html
      - name: Check the package for PyPI
        run: |
          pip install twine
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    # Builds the Docker image and runs the demo in it, as a user would
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t domain-security-check:test .
      - name: Run the demo in the image
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm domain-security-check:test --version
          docker run --rm -v "$PWD/out:/reports" domain-security-check:test --demo --pdf --lang fr
          ls out/bakery-example.com.html out/bakery-example.com.pdf
          grep -q "Actions prioritaires" out/bakery-example.com.html
